name: Coffee Local checks and release
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'
      timezone: 'Australia/Sydney'
permissions:
  contents: read
concurrency:
  group: coffee-local-${{ github.ref }}
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      security-events: write
    outputs:
      publish: ${{ steps.prepare.outputs.publish }}
      version: ${{ steps.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test automatic release and security gates
        run: python3 -m unittest discover -s tests -v
      - name: Prepare a version only for changed integration/release content
        id: prepare
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 coffee-tools/automatic_release.py prepare
      - name: Home Assistant integration validation
        uses: home-assistant/actions/hassfest@86d4564712fa02543c808e3a693dd04f9d3f8361
      - name: HACS and Marketplace repository validation
        uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa
        with:
          category: integration
          # Personal custom repository, not a submission to the public catalog.
          # Keep its README minimal and do not require catalog discovery metadata.
          ignore: description topics images
          comment: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370
        with:
          languages: python,actions
          build-mode: none
      - name: Real Home Assistant lifecycle
        run: python3 coffee-tools/test-ha.py
      - name: Upcoming Home Assistant and Marketplace compatibility
        run: python3 coffee-tools/test-ha.py --channel dev
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370
        with:
          output: work/codeql
      - name: Block HIGH and CRITICAL source vulnerabilities
        run: python3 coffee-tools/security_gate.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: coffee-local-maintenance-evidence
          path: work/
          retention-days: 7
  release:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.check.outputs.publish == 'true'
    needs: check
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Publish integration version for HACS and Marketplace
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.check.outputs.version }}
        run: python3 coffee-tools/automatic_release.py publish
  notes:
    if: always() && needs.check.result == 'success' && needs.release.result != 'failure' && needs.release.result != 'cancelled' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [check, release]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false
      - name: Keep published integration notes aligned with tested changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 coffee-tools/automatic_release.py notes
  report:
    if: always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [check, release, notes]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: python3 coffee-tools/report.py
